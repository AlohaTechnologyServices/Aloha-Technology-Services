name: Strengthen About service-quality narrative

on:
  push:
    paths:
      - '.github/workflows/strengthen-about-quality.yml'

permissions:
  contents: write

jobs:
  update-about:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Strengthen About page narrative
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text()

          old = '''<p>My hands-on background includes apprentice-level and supervised electrical work, irrigation-system installation and troubleshooting, landscaping and grounds support, flooring installation, and detailed finish work. From there, my career expanded into luxury residential and resort operations, where I became responsible for property readiness, inspections, maintenance planning, owner communication, guest service, vendor coordination, budgeting, documentation, and quality control.</p><p>Across those roles, I supported more than 50 high-value residences, coordinated with more than 60 local vendors, and helped manage thousands of guest arrivals and departures. I also developed inspection standards, SOPs, training materials, damage-tracking systems, and operational tools designed to make work more consistent, accountable, and easier to manage.</p>'''

          new = '''<p>My professional background gives me a broad, practical understanding of how properties, building systems, vendors, technology, and day-to-day operations work together. I built that perspective through hands-on experience with electrical work, irrigation, landscaping, flooring, and detailed finish work, then carried it into luxury residential and resort operations. That combination allows me to approach every ATS service with both technical awareness and an operator’s perspective—paying close attention to workmanship, condition, documentation, communication, and the details that determine whether a job is truly completed to a high standard.</p><p>Throughout my career, I have supported more than 50 high-value residences, coordinated with more than 60 local vendors, and helped manage thousands of guest arrivals and departures. I have also developed inspection standards, SOPs, training materials, damage-tracking systems, and operational tools. Those experiences taught me to work systematically, verify details, anticipate problems, communicate clearly, and follow through. I bring those same standards to every ATS service, with the goal of delivering work that is thorough, dependable, well documented, and completed at the highest level of quality I can provide.</p>'''

          if old not in text:
              raise SystemExit('Expected About paragraphs were not found; no changes made.')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate production build
        run: |
          npm ci
          npm run build

      - name: Commit update and remove temporary workflow
        run: |
          rm .github/workflows/strengthen-about-quality.yml
          git config user.name "AlohaTechnologyServices"
          git config user.email "alohatechnologyservice@gmail.com"
          git add src/App.jsx .github/workflows/strengthen-about-quality.yml
          git commit -m "Strengthen About service quality narrative"
          git push origin main
