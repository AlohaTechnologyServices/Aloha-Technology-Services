name: Update About page first-person career section

on:
  push:
    paths:
      - '.github/workflows/update-about-first-person.yml'

permissions:
  contents: write

jobs:
  update-about:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite About career section
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text()

          old = '''        <Card className="p-7 md:p-9"><h2 className="text-3xl font-bold text-[#061B33]">A career built around practical responsibility</h2><div className="mt-5 space-y-4 leading-8 text-slate-600"><p>Koa grew up in Waimea, graduated from Parker School and earned a Bachelor’s Degree from the University of Hawaiʻi at Mānoa before returning home to build his career.</p><p>His hands-on background includes apprentice-level and supervised electrical work, irrigation-system installation and troubleshooting, landscaping and grounds support, flooring installation and detailed finish work. His later career expanded into luxury residential and resort operations involving property readiness, inspections, maintenance planning, owner communication, guest service, vendor coordination, budgeting, documentation and quality control.</p><p>Across those roles, Koa supported more than 50 high-value residences, coordinated with over 60 local vendors and helped manage thousands of guest arrivals and departures. He also developed inspection standards, SOPs, training materials, damage-tracking systems and operational tools.</p></div></Card>'''

          new = '''        <Card className="p-7 md:p-9"><h2 className="text-3xl font-bold text-[#061B33]">Local roots. Hands-on experience. Operational leadership.</h2><div className="mt-5 space-y-4 leading-8 text-slate-600"><p>I grew up in Waimea, graduated from Parker School, and earned a Bachelor’s Degree in Physics from the University of Hawaiʻi at Mānoa before returning home to build my career.</p><p>My hands-on background includes apprentice-level and supervised electrical work, irrigation-system installation and troubleshooting, landscaping and grounds support, flooring installation, and detailed finish work. From there, my career expanded into luxury residential and resort operations, where I became responsible for property readiness, inspections, maintenance planning, owner communication, guest service, vendor coordination, budgeting, documentation, and quality control.</p><p>Across those roles, I supported more than 50 high-value residences, coordinated with more than 60 local vendors, and helped manage thousands of guest arrivals and departures. I also developed inspection standards, SOPs, training materials, damage-tracking systems, and operational tools designed to make work more consistent, accountable, and easier to manage.</p></div></Card>'''

          if old not in text:
              raise SystemExit('Expected About section was not found; no changes made.')

          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Validate production build
        run: |
          npm ci
          npm run build

      - name: Commit update and remove temporary workflow
        run: |
          rm .github/workflows/update-about-first-person.yml
          git config user.name "AlohaTechnologyServices"
          git config user.email "alohatechnologyservice@gmail.com"
          git add src/App.jsx .github/workflows/update-about-first-person.yml
          git commit -m "Rewrite About career section in first person"
          git push origin main
