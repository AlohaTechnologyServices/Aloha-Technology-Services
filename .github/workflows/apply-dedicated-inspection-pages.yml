name: Apply dedicated inspection pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-dedicated-inspection-pages.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild update package
        shell: bash
        run: |
          cat .github/ats-dedicated-pages/package.b64.part00 .github/ats-dedicated-pages/package.b64.part01 > /tmp/ats-package.b64
          base64 --decode /tmp/ats-package.b64 > /tmp/ats-package.zip
          mkdir -p /tmp/ats-package
          unzip -q /tmp/ats-package.zip -d /tmp/ats-package
          test -f /tmp/ats-package/ATS-Website-Dedicated-Inspection-Pages/apply_dedicated_inspection_pages.mjs

      - name: Apply dedicated inspection pages package
        shell: bash
        run: |
          node /tmp/ats-package/ATS-Website-Dedicated-Inspection-Pages/apply_dedicated_inspection_pages.mjs
          rm -rf _ats_dedicated_inspection_pages_backup

      - name: Validate production build
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Remove one-time migration files
        shell: bash
        run: |
          rm -rf .github/ats-dedicated-pages
          rm -f .github/workflows/apply-dedicated-inspection-pages.yml

      - name: Commit migrated website
        shell: bash
        run: |
          git config user.name "AlohaTechnologyServices"
          git config user.email "alohatechnologyservice@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "Add dedicated home inspection service pages"
          git push origin HEAD:main
